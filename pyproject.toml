[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flyrank-ml"
version = "0.1.0"
description = "FlyRank ML Internship - Google Search Ranking & Discoverability capstone"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "pyyaml", "matplotlib", "duckdb", "huggingface_hub"]

[tool.setuptools.packages.find]
where = ["src"]
